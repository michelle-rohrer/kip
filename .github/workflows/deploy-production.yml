name: Deploy Production

on:
  push:
    branches:
      - main

jobs:
  deploy:
    name: Trigger production deploy
    runs-on: ubuntu-latest
    steps:
      # Render deployt beide Services standardmaessig selbst (autoDeploy in render.yaml).
      # Die Hooks sind nur noetig, wenn autoDeploy im Dashboard abgeschaltet wurde.
      - name: Trigger backend production deploy
        env:
          HOOK_URL: ${{ secrets.PRODUCTION_BACKEND_DEPLOY_HOOK_URL }}
        run: |
          if [ -n "$HOOK_URL" ]; then
            curl -fsS -X POST "$HOOK_URL"
            echo "Backend deploy hook ausgeloest."
          else
            echo "Kein Backend-Hook gesetzt - Render deployt automatisch (autoDeploy)."
          fi

      - name: Trigger frontend production deploy
        env:
          HOOK_URL: ${{ secrets.PRODUCTION_FRONTEND_DEPLOY_HOOK_URL }}
        run: |
          if [ -n "$HOOK_URL" ]; then
            curl -fsS -X POST "$HOOK_URL"
            echo "Frontend deploy hook ausgeloest."
          else
            echo "Kein Frontend-Hook gesetzt - Render deployt automatisch (autoDeploy)."
          fi
