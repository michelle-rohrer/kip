name: Deploy Staging

on:
  push:
    branches:
      - develop

jobs:
  deploy:
    name: Trigger staging deploy
    runs-on: ubuntu-latest
    steps:
      # Staging ist optional: nur aktiv, wenn die Deploy-Hooks als GitHub Secrets
      # hinterlegt sind. Ohne Hooks läuft der Job einfach durch.
      - name: Trigger backend staging deploy
        env:
          HOOK_URL: ${{ secrets.STAGING_BACKEND_DEPLOY_HOOK_URL }}
        run: |
          if [ -n "$HOOK_URL" ]; then
            curl -fsS -X POST "$HOOK_URL"
            echo "Backend staging deploy ausgelöst."
          else
            echo "Kein Staging-Backend-Hook gesetzt - übersprungen."
          fi

      - name: Trigger frontend staging deploy
        env:
          HOOK_URL: ${{ secrets.STAGING_FRONTEND_DEPLOY_HOOK_URL }}
        run: |
          if [ -n "$HOOK_URL" ]; then
            curl -fsS -X POST "$HOOK_URL"
            echo "Frontend staging deploy ausgelöst."
          else
            echo "Kein Staging-Frontend-Hook gesetzt - übersprungen."
          fi
