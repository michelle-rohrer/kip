services:
  db:
    image: postgres:16-alpine
    container_name: calm_db
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - calm_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-calm} -d ${POSTGRES_DB:-calm}"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
    container_name: calm_backend
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    networks:
      - calm_net
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/db', timeout=3)\"",
        ]
      interval: 15s
      timeout: 5s
      retries: 5

  retrainer:
    build:
      context: ./backend
    container_name: calm_retrainer
    restart: unless-stopped
    env_file:
      - .env
    command: ["python", "-m", "app.ml.scheduler"]
    networks:
      - calm_net
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
    container_name: calm_frontend
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "${FRONTEND_PORT:-5173}:5173"
    networks:
      - calm_net
    depends_on:
      backend:
        condition: service_healthy

volumes:
  postgres_data:

networks:
  calm_net:
    driver: bridge
